<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The New Facelift</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;

            /* Cool gradient background */
            background: linear-gradient(135deg, #090979, #00d4ff);
        }

        h1 {
            font-size: 50px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        p {
            font-size: 22px;
            max-width: 700px;
        }

        img {
            width: 350px;
            height: auto;
            border-radius: 18px;
            margin-top: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <h1>✨ The New Facelift ✨</h1>
    <p>Your journey has only just begun — and the future looks brighter than ever.</p>

    <img src="https://images.unsplash.com/photo-1511974035430-5de47d3b95da?q=80&w=1200" alt="New Life">
</body>
</html>
